
name: Trivy Security Scan

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-FS-results.sarif
          severity: CRITICAL, HIGH


